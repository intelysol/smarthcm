# Enterprise Application Platform — Recovery Services Inventory & Certification State
# Version: 2.76.0
# Last Updated: 2026-09-22

services:
  - service: core-database
    name: Primary Relational Database (MySQL 8.0+)
    tier: tier-0
    rpo: "< 15m"
    rto: "< 60m"
    backup: Full daily mysqldump (--single-transaction) + 15m binlog archives to offsite S3
    restore: Automated restore.ps1 / restore.sh with checksum verification and PITR replay
    dependencies: []
    failover: Active-Passive Multi-AZ Replica with automated DNS promotion
    validation: Schema count audit (985 tables, 2180 FKs) + orphan check
    owner: Database Operations & Infrastructure Team
    last_tested: "2026-09-22T08:00:00Z"
    status: CERTIFIED

  - service: core-auth-identity
    name: Authentication & Identity Management
    tier: tier-0
    rpo: "0m"
    rto: "< 15m"
    backup: Embedded in Core DB + Git-managed configuration
    restore: Stateless web container launch + Redis session pool reconnection
    dependencies: [core-database, core-cache]
    failover: Horizontally scaled stateless web nodes behind AWS ALB
    validation: Login probe, token refresh, and MFA challenge verification
    owner: Identity & Security Engineering
    last_tested: "2026-09-22T08:15:00Z"
    status: CERTIFIED

  - service: multi-tenancy-engine

    restore: Container startup with TenantContext resolution
    dependencies: [core-database]
    failover: Stateless application layer redundancy
    validation: Cross-tenant IDOR/BOLA assertion test suite
    owner: Core Architecture Team
    last_tested: "2026-09-22T08:15:00Z"
    status: CERTIFIED

  - service: blob-storage

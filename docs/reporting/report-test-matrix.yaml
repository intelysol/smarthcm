# Enterprise Report Verification Test Matrix
version: "1.0"
governance_policy: "EPIC-2.73-TEST-MATRIX"
last_certified: "2026-09-16"

matrix:
  - report_id: "REP-OPS-001"
    name: "Employee Master Directory"
    owner: "Core HR"
    workspace: "HR Administration"
    data_source: "employees"
    permission: "employee.view"
    tenant_scope: "strict_tenant"
    filters: ["department_id", "employment_status"]
    expected_result: "List of active employees matching tenant and filters"
    security_test: "PASS - Cross-tenant queries return zero records"
    performance_test: "PASS - Query execution < 120ms on 10k rows"
    export_test: "PASS - CSV export generated with sanitized headers"
    schedule_test: "PASS - Verified recurring delivery and revocation gate"
    status: "CERTIFIED"


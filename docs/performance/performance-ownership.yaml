# Enterprise Application Platform — Performance Test Ownership Matrix
# Version: 2.77.0
# Last Updated: 2026-09-22

ownership_matrix:
  - test_id: perf-test-auth-latency
    domain: Identity & Access
    primary_owner: Identity Lead
    qa_owner: QA Performance Engineer
    platform_owner: Platform SRE Lead
    dataset: 5,000 Users, 50 Tenants
    load_profile: 1,000 concurrent authentications / min
    target: P95 < 50ms, Error Rate 0.0%
    result: P95 = 28ms, Error Rate 0.0%
    last_run: "2026-09-22T09:00:00Z"
    status: PASSED


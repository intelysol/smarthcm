# Security Regression Registry
version: "1.0.0"
last_updated: "2026-09-16"

regressions:
  - id: "SEC-0001"
    vulnerability: "Cross-tenant access via manipulated X-Tenant header"
    root_cause: "Header trusted without verifying authenticated user tenant membership"
    fix: "ResolveTenant middleware enforces user->canAccessTenant() check before context resolution"
    test: "Tests\\Security\\TenantIsolationTest::test_tenant_a_user_cannot_access_tenant_b_settings_via_header_manipulation"
    affected_domain: "Platform Core / Tenancy"
    severity: "CRITICAL"
    release: "2.74"

  - id: "SEC-0002"
    vulnerability: "CSV Spreadsheet Formula Injection"
    root_cause: "Exported cells starting with =, +, -, @ executed as formulas in Excel"
    fix: "HcmReportBuilderService::generateCsvExport prepends single quote to neutralize triggers"
    test: "Tests\\Feature\\Analytics\\HcmReportingAndKpiGovernanceTest::test_report_csv_export_sanitization"
    affected_domain: "Analytics & Reporting"
    severity: "HIGH"
    release: "2.73"

  - id: "SEC-0003"
    vulnerability: "Sensitive Report Dissemination to Revoked Users"
    root_cause: "Scheduled report jobs dispatched without real-time recipient permission check"
    fix: "validateScheduledDelivery JIT gate checks user status and domain permission before release"
    test: "Tests\\Feature\\Analytics\\HcmReportingAndKpiGovernanceTest::test_scheduled_report_delivery_security_gate"
    affected_domain: "Reporting"
    severity: "HIGH"
    release: "2.73"

  - id: "SEC-0004"
    vulnerability: "Unprotected Webhook Replay Attacks"
    root_cause: "Inbound webhook ingress accepted payloads with stale or missing timestamps"
    fix: "WebhookSecurityService verifies HMAC-SHA256 signature and rejects drift > 300s"
    test: "Tests\\Security\\ZeroTrustSecurityCertificationTest::test_webhook_signature_and_replay_prevention"
    affected_domain: "Integration Hub"
    severity: "HIGH"
    release: "2.74"

  - id: "SEC-0005"
    vulnerability: "AI Autonomous Destructive Action Execution"
    root_cause: "AI tool execution directly applied database mutations without user confirmation"
    fix: "EmployeeAiActionService marks actions PROPOSED until confirmAction is signed by user"
    test: "Tests\\Security\\ZeroTrustSecurityCertificationTest::test_ai_prompt_injection_defense"
    affected_domain: "AI Operations"
    severity: "HIGH"
    release: "2.74"

  - id: "SEC-0006"
    vulnerability: "Loose Type Tenant Comparison in BasePolicy"
    root_cause: "BasePolicy used loose type check on tenant IDs which could lead to type coercion issues"
    fix: "Harden BasePolicy to use strict string casting: (string) $user->tenant_id === (string) $model->tenant_id"
    test: "Tests\\Security\\ZeroTrustSecurityCertificationTest::test_cross_tenant_access_prevention"
    affected_domain: "Shared Policies"
    severity: "HIGH"
    release: "2.74"

  - id: "SEC-0007"
    vulnerability: "Missing Clickjacking & MIME Sniffing Protection Headers"
    root_cause: "No global HTTP security headers middleware was registered"
    fix: "Implement and register SecurityHeadersMiddleware applying CSP, XFO, and X-Content-Type-Options"
    test: "Tests\\Security\\ZeroTrustSecurityCertificationTest::test_security_headers_enforced"
    affected_domain: "Platform Core"
    severity: "MEDIUM"
    release: "2.74"

  - id: "SEC-0008"
    vulnerability: "Cleartext Bank and PII Exposure in Unprivileged Views"
    root_cause: "Raw bank accounts and tax IDs were returned in full without masking"
    fix: "Centralized SensitiveDataMasker masks accounts and sensitive identifiers"
    test: "Tests\\Security\\ZeroTrustSecurityCertificationTest::test_sensitive_data_masking"
    affected_domain: "Platform Shared Services"
    severity: "MEDIUM"
    release: "2.74"
